<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose - News Feed</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Font Google Inter per una tipografia moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Sinistra -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="brand-name">Pose</span>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <i class="fa-solid fa-newspaper"></i>
          <span>News</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        © 2026 Pose
      </div>
    </aside>

    <!-- Contenuto Principale -->
    <main class="main-content">
      <header class="content-header">
        <h1 class="page-title">News Feed</h1>
        <p class="subtitle">Le ultime notizie in tempo reale curate da BBC News</p>
      </header>

      <!-- Barra Filtri Categorie Cliccabili -->
      <div class="categories">
        <button class="cat-btn active" data-category="top">
          <i class="fa-solid fa-fire"></i> <span>Top News</span>
        </button>
        <button class="cat-btn" data-category="technology">
          <i class="fa-solid fa-laptop"></i> <span>Tech</span>
        </button>
        <button class="cat-btn" data-category="science_and_environment">
          <i class="fa-solid fa-flask"></i> <span>Science</span>
        </button>
        <button class="cat-btn" data-category="business">
          <i class="fa-solid fa-chart-line"></i> <span>Business</span>
        </button>
        <button class="cat-btn" data-category="world">
          <i class="fa-solid fa-earth-americas"></i> <span>World</span>
        </button>
      </div>

      <!-- Feed Notizie -->
      <div id="news-container" class="news-container">
        <!-- Contenuto generato dinamicamente da script.js -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
