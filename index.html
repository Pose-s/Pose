<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose - App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar / Navigation Menu -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon-wrapper">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="brand-name">Pose</span>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-page="home">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </button>
        <button class="nav-item" data-page="news">
          <i class="fa-solid fa-newspaper"></i>
          <span>News</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        © 2026 Pose
      </div>
    </aside>

    <!-- Contenuto Principale -->
    <main class="main-content">
      
      <!-- SEZIONE HOME -->
      <section id="page-home" class="page-section">
        <header class="content-header">
          <h1 class="page-title">Benvenuto su Pose</h1>
          <p class="subtitle">La tua piattaforma principale per contenuti e informazioni</p>
        </header>
        <div class="home-card">
          <i class="fa-solid fa-bolt home-hero-icon"></i>
          <h2>Esplora l'App</h2>
          <p>Seleziona la voce <strong>News</strong> dal menu per consultare le notizie aggiornate dalla BBC divise per categoria.</p>
        </div>
      </section>

      <!-- SEZIONE NEWS -->
      <section id="page-news" class="page-section hidden">
        <header class="content-header">
          <h1 class="page-title">News Feed</h1>
          <p class="subtitle">Le ultime notizie aggiornate in tempo reale da BBC News</p>
        </header>

        <!-- Filtri categorie (visibili SOLO nella sezione News) -->
        <div class="categories-wrapper">
          <div class="categories">
            <button class="cat-btn active" data-category="top">
              <i class="fa-solid fa-fire"></i> <span>Top News</span>
            </button>
            <button class="cat-btn" data-category="technology">
              <i class="fa-solid fa-laptop"></i> <span>Tech</span>
            </button>
            <button class="cat-btn" data-category="science_and_environment">
              <i class="fa-solid fa-flask"></i> <span>Science</span>
            </button>
            <button class="cat-btn" data-category="business">
              <i class="fa-solid fa-chart-line"></i> <span>Business</span>
            </button>
            <button class="cat-btn" data-category="world">
              <i class="fa-solid fa-earth-americas"></i> <span>World</span>
            </button>
          </div>
        </div>

        <!-- Feed Notizie -->
        <div id="news-container" class="news-container"></div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
