<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose - News App</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Icone FontAwesome per la grafica -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Sinistra -->
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-bolt brand-icon"></i>
        <span class="brand-name">Pose</span>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <i class="fa-solid fa-newspaper"></i>
          <span>News</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        © 2026 Pose
      </div>
    </aside>

    <!-- Contenuto Principale -->
    <main class="main-content">
      <h1 class="page-title">News Feed</h1>

      <!-- Categorie -->
      <div class="categories">
        <button class="cat-btn active" data-category="top">
          <i class="fa-solid fa-fire"></i> Top News
        </button>
        <button class="cat-btn" data-category="technology">
          <i class="fa-solid fa-laptop"></i> Tech
        </button>
        <button class="cat-btn" data-category="science_and_environment">
          <i class="fa-solid fa-flask"></i> Science
        </button>
        <button class="cat-btn" data-category="business">
          <i class="fa-solid fa-chart-line"></i> Business
        </button>
        <button class="cat-btn" data-category="world">
          <i class="fa-solid fa-puzzle-piece"></i> World
        </button>
      </div>

      <!-- Feed Notizie BBC -->
      <div id="news-container" class="news-container">
        <!-- Le notizie vengono caricate qui via JS -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
