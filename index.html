<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts per un look pulito e moderno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar / Navigazione -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Pose</span>
      </div>

      <nav class="nav-menu">
        <button id="nav-home" class="nav-btn active" onclick="switchTab('home')">
          <span class="icon">🏠</span> Home
        </button>
        <button id="nav-news" class="nav-btn" onclick="switchTab('news')">
          <span class="icon">📰</span> News
        </button>
      </nav>

      <div class="footer-copy">
        © 2026 Pose
      </div>
    </aside>

    <!-- Contenuto Principale -->
    <main class="main-content">
      
      <!-- SEZIONE HOME -->
      <section id="section-home" class="content-section">
        <header class="section-header">
          <h1>News Feed</h1>
          <p class="subtitle">Le ultime notizie aggiornate in tempo reale da BBC News</p>
        </header>

        <div class="feed-container">
          <h2>Home Feed</h2>
          <p class="feed-subtitle">Cosa sta succedendo nella community</p>

          <!-- Card Creazione Post -->
          <div class="create-post-card">
            <h3>Crea un nuovo post</h3>
            <form id="post-form">
              <input type="text" id="post-author" placeholder="Il tuo nome" required>
              <input type="text" id="post-content" placeholder="A cosa stai pensando?" required>
              <input type="url" id="post-image" placeholder="URL Immagine (es. https://picsum.photos/500)">
              <button type="submit" class="btn-submit">Pubblica</button>
            </form>
          </div>

          <!-- Lista Post Pubblicati -->
          <div id="posts-list" class="posts-list"></div>
        </div>
      </section>

      <!-- SEZIONE NEWS (BBC) -->
      <section id="section-news" class="content-section hidden">
        <header class="section-header">
          <h1>BBC World News</h1>
          <p class="subtitle">Tutte le ultime notizie direttamente da BBC News</p>
        </header>

        <div id="news-loader" class="loader">Caricamento notizie...</div>
        <div id="news-container" class="news-list"></div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
