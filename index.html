<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTENUTO PRINCIPALE DELLA PAGINA -->
  <main class="main-content">
    <div class="empty-state">
      <div class="folder-icon">📁</div>
      <p>Nessun post presente.<br>Premi il tasto <strong>(+)</strong> per crearne uno!</p>
    </div>
  </main>

<!-- BARRA DI NAVIGAZIONE IN BASSO -->
  <nav class="bottom-nav">
    
    <!-- Tasto Home -->
    <a href="#" class="nav-btn active" data-page="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Home</span>
    </a>

    <!-- Tasto (+) centrale fluttuante per aprire il modale -->
    <button id="add-post-btn" class="add-btn" aria-label="Crea post">+</button>

    <!-- Tasto News -->
    <a href="#" class="nav-btn" data-page="news">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      <span>News</span>
    </a>

  </nav>

  <!-- COLLEGAMENTO SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
