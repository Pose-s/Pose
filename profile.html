<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Profilo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="lang.js"></script>
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span data-i18n="nav_news">News</span>
        </a>
        <a href="home.html" class="nav-item">
          <i data-lucide="home"></i>
          <span data-i18n="nav_home">Home</span>
        </a>
        <a href="profile.html" class="nav-item active">
          <i data-lucide="user"></i>
          <span data-i18n="nav_profile">Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> <span data-i18n="btn_logout">Esci</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="profile-page">

        <div class="profile-header-bar">
          <!-- Icona Messaggi con SVG personalizzato -->
          <a href="messages.html" class="notification-bell-btn messages-btn" id="messagesBtn">
            <svg viewBox="0 0 100 100" class="msg-custom-icon">
              <path class="msg-bubble-back" d="M 28 35 H 56 A 9 9 0 0 1 65 44 V 62 A 9 9 0 0 1 56 71 H 28 L 22 84 L 22 71 A 9 9 0 0 1 14 62 V 44 A 9 9 0 0 1 23 35 Z" />
              <circle class="msg-dot-back" cx="28" cy="53" r="3.5" />
              <path class="msg-bubble-front" d="M 45 15 H 81 A 10 10 0 0 1 91 25 V 47 A 10 10 0 0 1 81 57 H 77 L 77 70 L 66 57 H 45 A 10 10 0 0 1 35 47 V 25 A 10 10 0 0 1 45 15 Z" />
              <g class="msg-dots-front">
                <circle cx="53" cy="36" r="3.5" />
                <circle cx="63" cy="36" r="3.5" />
                <circle cx="73" cy="36" r="3.5" />
              </g>
            </svg>
            <span class="notif-badge-dot hidden" id="msgBadgeDot"></span>
          </a>

          <!-- Icona Notifiche -->
          <button type="button" class="notification-bell-btn" id="notificationBtn">
            <svg viewBox="0 0 48 48" class="notif-icon">
              <path class="notif-liquid-fill" d="M10 16 L38 16 L24 34 Z" />
              <ellipse class="notif-olive-fill" cx="27" cy="21" rx="3.2" ry="4.2" transform="rotate(25 27 21)" />
              <path class="notif-outline" d="M24 14 C24 9 19 5 14 7 C9 9 8 14 8 16 C8 19 12 23 24 34 C36 23 40 19 40 16 C40 14 39 9 34 7 C29 5 24 9 24 14 Z" />
              <line class="notif-outline" x1="10" y1="16" x2="38" y2="16" />
              <ellipse class="notif-outline notif-olive-outline" cx="27" cy="21" rx="3.2" ry="4.2" transform="rotate(25 27 21)" />
              <line class="notif-outline" x1="24" y1="34" x2="24" y2="42" />
              <ellipse class="notif-outline" cx="24" cy="44" rx="9" ry="2" />
            </svg>
            <span class="notif-badge-dot hidden" id="notifBadgeDot"></span>
          </button>

          <div class="notifications-panel hidden" id="notificationsPanel">
            <h3 data-i18n="notif_title">Notifiche</h3>
            <div id="notificationsList"></div>
          </div>
        </div>

        <div class="profile-top-row">
          <div class="profile-username-block">
            <span class="profile-username" id="profileUsername">@nomeutente</span>
          </div>

          <div class="profile-avatar-block">
            <img id="currentLogo" class="profile-avatar-lg hidden" alt="Logo profilo" />
            <div class="profile-logo-placeholder-lg" id="logoPlaceholder">
              <i data-lucide="user"></i>
            </div>
          </div>

          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-number" id="statPosts">0</span>
              <span class="stat-label" data-i18n="profile_posts">Post</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="statFollowers">0</span>
              <span class="stat-label" data-i18n="profile_followers">Follower</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="statFollowing">0</span>
              <span class="stat-label" data-i18n="profile_following">Seguiti</span>
            </div>
          </div>
        </div>

        <p class="profile-bio" id="profileBio"></p>

        <div class="profile-action-row">
          <button type="button" class="btn-compact" id="editProfileToggleBtn" data-i18n="btn_edit_profile">Modifica profilo</button>
          <button type="button" class="btn-compact" id="settingsBtn" data-i18n="btn_settings">Impostazioni</button>
        </div>

        <!-- Form modifica profilo -->
        <div class="profile-card hidden" id="editProfileCard">
          <button type="button" class="avatar-upload-btn" id="avatarUploadBtn">
            <img id="editLogoPreview" class="preview-circle hidden" alt="Logo profilo" />
            <div class="profile-logo-placeholder-lg" id="editLogoPlaceholder">
              <i data-lucide="user"></i>
            </div>
            <div class="avatar-overlay">
              <i data-lucide="camera"></i>
            </div>
          </button>
          <input type="file" id="newLogoInput" accept="image/*" class="hidden" />

          <form id="profileForm">
            <div class="form-group">
              <label for="usernameEditInput">Nome utente</label>
              <input type="text" id="usernameEditInput" required pattern="[a-zA-Z0-9_]{3,20}" />
              <span class="field-hint" id="usernameEditHint"></span>
            </div>
            <div class="form-group">
              <label for="displayNameInput">Nome visualizzato</label>
              <input type="text" id="displayNameInput" required />
            </div>
            <div class="form-group">
              <label for="bioEditInput">Bio</label>
              <textarea id="bioEditInput" placeholder="Parlaci un po' di te..."></textarea>
            </div>
            <p id="profileMsg" class="auth-error hidden"></p>
            <button type="submit" class="publish-btn" id="saveProfileBtn" data-i18n="btn_save">Salva modifiche</button>
          </form>
        </div>

        <!-- Tab Post del Profilo -->
        <div class="profile-tabs">
          <button type="button" class="profile-tab active" data-tab="posts"><i data-lucide="grid-3x3"></i></button>
          <button type="button" class="profile-tab" data-tab="reposts"><i data-lucide="repeat"></i></button>
          <button type="button" class="profile-tab" data-tab="tagged"><i data-lucide="user-square"></i></button>
        </div>

        <div class="profile-posts-section" id="tabPosts">
          <div id="profilePostsLoader" class="loader hidden"><div class="spinner"></div></div>
          <div class="posts-grid" id="profilePostsGrid"></div>
        </div>

        <div class="profile-posts-section hidden" id="tabReposts">
          <div id="repostsLoader" class="loader hidden"><div class="spinner"></div></div>
          <div class="posts-grid" id="repostsGrid"></div>
        </div>

        <div class="profile-posts-section hidden" id="tabTagged">
          <div id="taggedLoader" class="loader hidden"><div class="spinner"></div></div>
          <div class="posts-grid" id="taggedGrid"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- MODALE MODIFICA POST PROFILO -->
  <div class="modal-overlay hidden" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="modal_edit_title">Modifica post</h2>
        <button class="modal-close" id="closeModalBtn"><i data-lucide="x"></i></button>
      </div>

      <form id="postForm">
        <div class="form-group">
          <label for="photoInput">Foto del post</label>
          <input type="file" id="photoInput" accept="image/*" />
          <img id="photoPreview" class="preview-rect hidden" alt="Anteprima foto" />
        </div>

        <div class="form-group">
          <label for="captionInput" data-i18n="caption_placeholder">Didascalia</label>
          <textarea id="captionInput" placeholder="Scrivi una didascalia..." data-i18n="caption_placeholder"></textarea>
        </div>

        <!-- Campo Luogo con Ricerca e Tendina Suggestions -->
        <div class="form-group location-input-group" style="position: relative;">
          <label for="locationInput" data-i18n="location_label">Luogo (opzionale)</label>
          <div style="position: relative;">
            <input 
              type="text" 
              id="locationInput" 
              placeholder="Aggiungi luogo (es: Roma, Italia)" 
              data-i18n="location_placeholder" 
              class="form-input" 
              autocomplete="off" 
            />
            <div id="locationSuggestions" class="location-suggestions-dropdown hidden"></div>
          </div>
        </div>

        <button type="submit" class="publish-btn" id="publishBtn" data-i18n="btn_save">Salva modifiche</button>
      </form>
    </div>
  </div>

  <!-- MODALE COMMENTI -->
  <div class="modal-overlay hidden" id="commentsModal">
    <div class="modal modal-post-detail">
      <div class="modal-header">
        <h2 data-i18n="comments_title">Post</h2>
        <button class="modal-close" id="closeCommentsBtn"><i data-lucide="x"></i></button>
      </div>
      <div id="commentsPostMedia"></div>
      <p id="commentsPostCaption" class="post-caption hidden"></p>
      <div class="comments-list" id="commentsList"></div>
      <form id="commentForm" class="comment-form">
  <input type="text" id="commentInput" placeholder="Scrivi un commento..." />
  
  <!-- Tasto Sticker -->
  <button type="button" id="commentStickerBtn" class="comment-tool-btn" title="Sticker">
    <i data-lucide="smile"></i>
  </button>
  
  <button type="submit" class="comment-send-btn">
    <i data-lucide="send"></i>
  </button>
</form>
    </div>
  </div>

  <!-- MODALE CONDIVIDI POST -->
  <div class="modal-overlay hidden" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Invia post</h2>
        <button class="modal-close" id="closeShareBtn"><i data-lucide="x"></i></button>
      </div>
      <input type="text" id="shareSearchInput" placeholder="Cerca..." class="search-input-modal" />
      <p class="otp-info hidden" id="shareEmptyMsg">Puoi inviare messaggi solo a chi ti segue e che segui anche tu.</p>
      <div id="shareFriendsList"></div>
    </div>
  </div>

  <!-- MODALE SCELTA TAG -->
  <div class="modal-overlay hidden" id="tagChoiceModal">
    <div class="modal modal-small">
      <div class="modal-header">
        <h2>Tag</h2>
        <button class="modal-close" id="closeTagChoiceBtn"><i data-lucide="x"></i></button>
      </div>
      <button type="button" class="menu-item" id="viewTagsChoiceBtn">
        <i data-lucide="eye"></i> Vedi persone taggate
      </button>
      <button type="button" class="menu-item" id="addTagsChoiceBtn">
        <i data-lucide="user-plus"></i> Aggiungi tag
      </button>
    </div>
  </div>

  <script type="module" src="profile.js"></script>
  <script src="sidebar-toggle.js"></script>
</body>
</html>
