<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span>News</span>
        </a>
        <a href="home.html" class="nav-item active">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span>Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> Esci
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="home-header">
        <div class="search-bar-container" id="searchBarContainer">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Cerca..." autocomplete="off" />
          <div class="search-results hidden" id="searchResults"></div>
        </div>
        <button class="add-post-btn" id="addPostBtn">
          <i data-lucide="plus"></i>
        </button>
      </header>

      <div class="stories-bar" id="storiesBar"></div>
      <input type="file" id="storyPhotoInput" accept="image/*" class="hidden" />

      <div id="postsLoader" class="loader hidden">
        <div class="spinner"></div>
      </div>

      <div class="posts-grid" id="postsGrid"></div>
    </main>
  </div>

  <!-- Modale Crea/Modifica Post -->
  <div class="modal-overlay hidden" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="postModalTitle">Crea un nuovo post</h2>
        <button class="modal-close" id="closeModalBtn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="postForm">
        <div class="form-group">
  <label for="photoInput">Foto e video (max 10)</label>
  <input type="file" id="photoInput" accept="image/*,video/*" multiple />
  <div class="media-preview-strip" id="mediaPreviewStrip"></div>
</div>

        <div class="form-group">
          <label for="captionInput">Didascalia</label>
          <textarea id="captionInput" placeholder="Scrivi una didascalia..."></textarea>
        </div>
        <button type="button" class="btn-compact" id="openTagModalBtn">
  <i data-lucide="user-plus"></i> Tagga persone
</button>
<div id="taggedPreview" class="tagged-preview"></div>

        <button type="submit" class="publish-btn" id="publishBtn">Pubblica</button>
      </form>
    </div>
  </div>

  <!-- Modale Commenti Post -->
  <div class="modal-overlay hidden" id="commentsModal">
  <div class="modal modal-post-detail">
    <div class="modal-header">
      <h2>Post</h2>
      <button class="modal-close" id="closeCommentsBtn">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div id="commentsPostMedia"></div>
    <p id="commentsPostCaption" class="post-caption hidden"></p>
    <div class="comments-list" id="commentsList"></div>
        <button class="modal-close" id="closeCommentsBtn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="comments-list" id="commentsList"></div>

      <form id="commentForm" class="comment-form">
        <input type="text" id="commentInput" placeholder="Scrivi un commento..." required />
        <button type="submit" class="comment-send-btn">
          <i data-lucide="send"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Visualizzatore Storie -->
  <div class="story-viewer hidden" id="storyViewer">
    <div class="story-progress-bar" id="storyProgressBar"></div>
    <div class="story-viewer-header">
      <img id="storyViewerAvatar" class="story-viewer-avatar hidden" alt="" />
      <div class="story-viewer-placeholder hidden" id="storyViewerPlaceholder">
        <i data-lucide="user"></i>
      </div>
      <span id="storyViewerUsername"></span>
      <span class="story-viewer-time" id="storyViewerTime"></span>
      <button type="button" class="story-viewer-close" id="storyViewerClose">
        <i data-lucide="x"></i>
      </button>
    </div>

    <img id="storyViewerImage" class="story-viewer-image" alt="Storia">
    <div class="story-nav-zone story-nav-left" id="storyNavLeft"></div>
    <div class="story-nav-zone story-nav-right" id="storyNavRight"></div>

    <!-- Barra proprietario: vede chi ha guardato -->
    <div class="story-bottom-bar" id="storyOwnerBar">
    <button type="button" class="story-viewers-btn" id="storyTagViewBtn">
  <i data-lucide="users"></i>
</button>  
  <button type="button" class="story-viewers-btn" id="storyViewersBtn">
    <i data-lucide="eye"></i>
    <span id="storyViewersCount">0</span>
  </button>
  <button type="button" class="story-delete-btn" id="storyDeleteBtn">
    <i data-lucide="trash-2"></i>
  </button>
</div>

    <!-- Barra visitatore: like e commento -->
    <div class="story-bottom-bar hidden" id="storyViewerBar">
    <button type="button" class="story-viewers-btn" id="storyTagViewBtn">
  <i data-lucide="users"></i>
</button>
<button type="button" class="story-viewers-btn" id="storyTagViewBtn2">
  <i data-lucide="tag"></i>
</button>
<button type="button" class="story-viewers-btn" id="storyRepostBtn">
  <i data-lucide="repeat"></i>
</button>
      <button type="button" class="story-like-btn" id="storyLikeBtn">
        <i data-lucide="heart"></i>
      </button>
      <input type="text" id="storyCommentInput" placeholder="Invia un messaggio..." autocomplete="off" />
      <button type="button" class="story-comment-send-btn" id="storyCommentSendBtn">
        <i data-lucide="send"></i>
      </button>
    </div>

    <!-- Pannello visualizzazioni (solo proprietario) -->
    <div class="story-viewers-panel hidden" id="storyViewersPanel">
      <div class="story-viewers-header">
        <h3>Visualizzazioni</h3>
        <button type="button" id="closeViewersPanelBtn"><i data-lucide="x"></i></button>
      </div>
      <input type="text" id="viewersSearchInput" placeholder="Cerca..." class="search-input-modal" />
      <div class="story-viewers-tabs">
        <button type="button" class="story-viewers-tab active" data-tab="views">Visualizzazioni</button>
        <button type="button" class="story-viewers-tab" data-tab="comments">Commenti</button>
      </div>
      <div id="storyViewersList"></div>
      <div id="storyCommentsOwnerList" class="hidden"></div>
    </div>
  </div>

  <script type="module" src="home.js"></script>
  <script src="sidebar-toggle.js"></script>
  <script src="cookie-banner.js"></script>
  <div class="modal-overlay hidden" id="shareModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Invia post</h2>
      <button class="modal-close" id="closeShareBtn"><i data-lucide="x"></i></button>
    </div>
    <input type="text" id="shareSearchInput" placeholder="Cerca..." class="search-input-modal" />
    <p class="otp-info hidden" id="shareEmptyMsg">Puoi inviare messaggi solo a chi ti segue e che segui anche tu.</p>
    <div id="shareFriendsList"></div>
  </div>
</div>
<div class="story-editor hidden" id="storyEditor">
  <canvas id="storyEditorCanvas" class="story-editor-canvas"></canvas>

  <div class="camera-top-bar">
    <button type="button" class="camera-icon-btn" id="storyEditorCloseBtn"><i data-lucide="x"></i></button>
  </div>
<div class="camera-edit-toolbar">
  <button type="button" class="camera-icon-btn" id="storyDrawToolBtn"><i data-lucide="pencil"></i></button>
  <button type="button" class="camera-icon-btn" id="storyEraserToolBtn"><i data-lucide="eraser"></i></button>
  <button type="button" class="camera-icon-btn" id="storyTextToolBtn"><i data-lucide="type"></i></button>
  <label for="storyColorInput" class="color-picker-btn" id="colorPickerBtn" style="background:#ffffff"></label>
<input type="color" id="storyColorInput" class="hidden-color-input" value="#ffffff" />
  <button type="button" class="camera-icon-btn" id="storyUndoBtn" title="Annulla"><i data-lucide="undo-2"></i></button>
  <button type="button" class="camera-icon-btn" id="storyTagBtn" title="Tagga persone"><i data-lucide="user-plus"></i></button>
</div>

<div class="text-style-bar hidden" id="textStyleBar"></div>
  
  <div class="camera-edit-bottom">
    <button type="button" class="camera-discard-btn" id="storyEditorDiscardBtn"><i data-lucide="trash-2"></i></button>
    <button type="button" class="camera-send-btn" id="storyEditorPublishBtn"><i data-lucide="send"></i></button>
  </div>

  <input type="text" id="storyTextInput" class="camera-text-input hidden" placeholder="Scrivi..." />
  <div id="storyMentionSuggestions" class="mention-suggestions hidden"></div>
</div>
<div class="modal-overlay hidden" id="tagModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Tagga persone</h2>
      <button class="modal-close" id="closeTagModalBtn"><i data-lucide="x"></i></button>
    </div>
    <input type="text" id="tagSearchInput" placeholder="Cerca utenti..." class="search-input-modal" />
    <div id="tagResultsList"></div>
    <div id="taggedSelectedList" class="tagged-selected-list"></div>
    <button type="button" class="publish-btn" id="tagModalDoneBtn">Fatto</button>
  </div>
</div>
<div class="modal-overlay hidden" id="tagChoiceModal">
  <div class="modal modal-small">
    <div class="modal-header">
      <h2>Tag</h2>
      <button class="modal-close" id="closeTagChoiceBtn"><i data-lucide="x"></i></button>
    </div>
    <button type="button" class="menu-item" id="viewTagsChoiceBtn">
      <i data-lucide="eye"></i> Vedi persone taggate
    </button>
    <button type="button" class="menu-item" id="addTagsChoiceBtn">
      <i data-lucide="user-plus"></i> Aggiungi tag
    </button>
  </div>
</div>
</body>
</html>
