<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
  <img src="logo.png.png" class="logo-img" alt="Pose" />
  <span>Pose</span>
</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span>News</span>
        </a>
        <a href="home.html" class="nav-item active">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span>Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> Esci
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="home-header">
        <h1>Home</h1>
        <button class="add-post-btn" id="addPostBtn">
          <i data-lucide="plus"></i>
        </button>
      </header>

      <div id="postsLoader" class="loader hidden">
        <div class="spinner"></div>
      </div>

      <div class="posts-grid" id="postsGrid"></div>
    </main>
  </div>

  <!-- Modale Crea/Modifica Post -->
  <div class="modal-overlay hidden" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="postModalTitle">Crea un nuovo post</h2>
        <button class="modal-close" id="closeModalBtn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="postForm">
        <div class="form-group">
          <label for="photoInput">Foto del post</label>
          <input type="file" id="photoInput" accept="image/*" />
          <img id="photoPreview" class="preview-rect hidden" alt="Anteprima foto" />
        </div>

        <div class="form-group">
          <label for="captionInput">Didascalia</label>
          <textarea id="captionInput" placeholder="Scrivi una didascalia..."></textarea>
        </div>

        <button type="submit" class="publish-btn" id="publishBtn">Pubblica</button>
      </form>
    </div>
  </div>

  <!-- Modale Commenti -->
  <div class="modal-overlay hidden" id="commentsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Commenti</h2>
        <button class="modal-close" id="closeCommentsBtn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="comments-list" id="commentsList"></div>

      <form id="commentForm" class="comment-form">
        <input type="text" id="commentInput" placeholder="Scrivi un commento..." required />
        <button type="submit" class="comment-send-btn">
          <i data-lucide="send"></i>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
