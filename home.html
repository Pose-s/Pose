<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Home</title>
  
  <link rel="icon" type="image/png" href="logo.png.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="lang.js"></script>
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span data-i18n="nav_news">News</span>
        </a>
        <a href="home.html" class="nav-item active">
          <i data-lucide="home"></i>
          <span data-i18n="nav_home">Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span data-i18n="nav_profile">Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> <span data-i18n="btn_logout">Esci</span>
        </button>
      </div>
    </aside>

    <!-- Contenuto principale -->
    <main class="main-content">
      <div class="home-page">

        <!-- Barra Superiore: Solo la Ricerca -->
        <div class="home-header-bar">
          <div class="home-search-block" id="searchBarContainer" style="position: relative;">
            <input type="text" id="searchInput" class="search-input" placeholder="Cerca utenti..." />
            <div class="search-results-dropdown hidden" id="searchResults"></div>
          </div>
        </div>

        <!-- Barra Storie -->
        <div class="stories-bar" id="storiesBar"></div>
        <input type="file" id="storyPhotoInput" accept="image/*" class="hidden" />

        <!-- Feed dei post -->
        <div id="postsLoader" class="loader hidden"><div class="spinner"></div></div>
        <div class="feed-container posts-grid" id="postsGrid"></div>

      </div>
    </main>
  </div>

  <!-- MODALE CREA / MODIFICA POST -->
  <div class="modal-overlay hidden" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="postModalTitle" data-i18n="modal_create_title">Crea un nuovo post</h2>
        <button class="modal-close" id="closeModalBtn"><i data-lucide="x"></i></button>
      </div>

      <form id="postForm">
        <div class="form-group">
          <label for="captionInput" data-i18n="caption_placeholder">Didascalia</label>
          <textarea id="captionInput" placeholder="Scrivi una didascalia..." data-i18n="caption_placeholder"></textarea>
        </div>

        <div class="form-group location-input-group" style="position: relative;">
          <label for="locationInput" data-i18n="location_label">Luogo (opzionale)</label>
          <div style="position: relative;">
            <input 
              type="text" 
              id="locationInput" 
              placeholder="Cerca un luogo..." 
              data-i18n="location_placeholder" 
              class="form-input" 
              autocomplete="off" 
            />
            <div id="locationSuggestions" class="location-suggestions-dropdown hidden"></div>
          </div>
        </div>

        <div class="form-group">
          <label data-i18n="tag_products">Tagga prodotto o link</label>
          <input type="text" id="productLabelInput" placeholder="Nome prodotto / Testo link" class="form-input" />
          <input type="url" id="productUrlInput" placeholder="URL link (es: https://...)" class="form-input" style="margin-top: 6px;" />
        </div>

        <div class="form-group">
          <label>Foto/Video</label>
          <input type="file" id="photoInput" accept="image/*,video/*" multiple />
          <div id="mediaPreviewStrip" class="media-preview-grid"></div>
        </div>

        <div class="form-group">
          <button type="button" class="btn-compact" id="openTagModalBtn">
            <i data-lucide="user-plus"></i> <span data-i18n="tag_people">Tagga persone</span>
          </button>
          <div id="taggedPreview" class="tagged-preview-badges"></div>
        </div>

        <button type="submit" class="publish-btn" id="publishBtn" data-i18n="btn_publish">Pubblica</button>
      </form>
    </div>
  </div>

  <!-- MODALE TAG PERSONE -->
  <div class="modal-overlay hidden" id="tagModal">
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="tag_people">Tagga persone</h2>
        <button class="modal-close" id="closeTagModalBtn"><i data-lucide="x"></i></button>
      </div>
      <input type="text" id="tagSearchInput" placeholder="Cerca persone..." class="search-input-modal" />
      <div id="taggedSelectedList" class="tagged-selected-list"></div>
      <div id="tagResultsList" class="tag-results-list"></div>
      <button type="button" class="publish-btn" id="tagModalDoneBtn">Fatto</button>
    </div>
  </div>

  <!-- MODALE SCELTA TAG SUL POST -->
  <div class="modal-overlay hidden" id="tagChoiceModal">
    <div class="modal modal-small">
      <div class="modal-header">
        <h2>Tag</h2>
        <button class="modal-close" id="closeTagChoiceBtn"><i data-lucide="x"></i></button>
      </div>
      <button type="button" class="menu-item" id="viewTagsChoiceBtn">
        <i data-lucide="eye"></i> Vedi persone taggate
      </button>
      <button type="button" class="menu-item" id="addTagsChoiceBtn">
        <i data-lucide="user-plus"></i> Modifica tag
      </button>
    </div>
  </div>

  <!-- MODALE COMMENTI -->
  <div class="modal-overlay hidden" id="commentsModal">
    <div class="modal modal-post-detail">
      <div class="modal-header">
        <h2 data-i18n="comments_title">Commenti</h2>
        <button class="modal-close" id="closeCommentsBtn"><i data-lucide="x"></i></button>
      </div>
      <div id="commentsPostMedia"></div>
      <p id="commentsPostCaption" class="post-caption hidden"></p>
      <div class="comments-list" id="commentsList"></div>
      <form id="commentForm" class="comment-form">
        <input type="text" id="commentInput" placeholder="Scrivi un commento..." data-i18n="comment_placeholder" required />
        <button type="submit" class="comment-send-btn"><i data-lucide="send"></i></button>
      </form>
    </div>
  </div>

  <!-- MODALE INVIA POST -->
  <div class="modal-overlay hidden" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Invia post</h2>
        <button class="modal-close" id="closeShareBtn"><i data-lucide="x"></i></button>
      </div>
      <input type="text" id="shareSearchInput" placeholder="Cerca..." class="search-input-modal" />
      <p class="otp-info hidden" id="shareEmptyMsg">Puoi inviare messaggi solo a chi ti segue e che segui anche tu.</p>
      <div id="shareFriendsList"></div>
    </div>
  </div>

  <!-- VIEWER STORIE -->
  <div class="story-viewer-overlay hidden" id="storyViewer">
    <div class="story-viewer-progress-bars" id="storyProgressBar"></div>
    <div class="story-viewer-header">
      <div class="story-viewer-author">
        <img id="storyViewerAvatar" class="story-viewer-avatar hidden" alt="" />
        <div class="story-viewer-placeholder hidden" id="storyViewerPlaceholder"><i data-lucide="user"></i></div>
        <span id="storyViewerUsername"></span>
        <span class="story-viewer-time" id="storyViewerTime"></span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="story-tag-btn" id="storyTagViewBtn2"><i data-lucide="tag"></i></button>
        <button type="button" class="story-viewer-close" id="storyViewerClose"><i data-lucide="x"></i></button>
      </div>
    </div>

    <div class="story-nav-area story-nav-left" id="storyNavLeft"></div>
    <div class="story-nav-area story-nav-right" id="storyNavRight"></div>

    <div class="story-viewer-media-container">
      <img id="storyViewerImage" class="story-viewer-img" alt="" />
    </div>

    <div class="story-owner-bar hidden" id="storyOwnerBar">
      <button type="button" class="story-viewers-count-btn" id="storyViewersBtn">
        <i data-lucide="eye"></i> <span id="storyViewersCount">0</span>
      </button>
      <button type="button" class="story-delete-btn" id="storyDeleteBtn"><i data-lucide="trash-2"></i></button>
    </div>

    <div class="story-viewer-bar hidden" id="storyViewerBar">
      <input type="text" id="storyCommentInput" placeholder="Invia un messaggio..." autocomplete="off" />
      <button type="button" id="storyCommentSendBtn"><i data-lucide="send"></i></button>
      <button type="button" id="storyLikeBtn"><i data-lucide="heart"></i></button>
      <button type="button" id="storyRepostBtn"><i data-lucide="repeat"></i></button>
    </div>

    <div class="story-viewers-panel hidden" id="storyViewersPanel">
      <div class="story-viewers-panel-header">
        <div class="story-viewers-tabs">
          <button type="button" class="story-viewers-tab active" data-tab="views">Visualizzazioni</button>
          <button type="button" class="story-viewers-tab" data-tab="comments">Commenti</button>
        </div>
        <button type="button" id="closeViewersPanelBtn"><i data-lucide="x"></i></button>
      </div>
      <input type="text" id="viewersSearchInput" placeholder="Cerca tra le visualizzazioni..." class="search-input-modal" />
      <div id="storyViewersList" class="story-viewers-list"></div>
      <div id="storyCommentsOwnerList" class="story-comments-list hidden"></div>
    </div>
  </div>

  <!-- EDITOR STORIE -->
  <div class="story-editor-overlay hidden" id="storyEditor">
    <canvas id="storyEditorCanvas"></canvas>
    
    <div class="story-editor-top-bar">
      <button type="button" id="storyEditorCloseBtn"><i data-lucide="x"></i></button>
      <div class="story-editor-tools">
        <button type="button" id="storyTextToolBtn"><i data-lucide="type"></i></button>
        <button type="button" id="storyDrawToolBtn"><i data-lucide="pen-tool"></i></button>
        <button type="button" id="storyEraserToolBtn"><i data-lucide="eraser"></i></button>
        <button type="button" id="storyTagBtn"><i data-lucide="user-plus"></i></button>
        <div class="color-picker-wrapper">
          <input type="color" id="storyColorInput" value="#ffffff" />
          <button type="button" id="colorPickerBtn" style="background:#ffffff;"></button>
        </div>
        <button type="button" id="storyUndoBtn"><i data-lucide="undo"></i></button>
      </div>
    </div>

    <div class="text-style-bar hidden" id="textStyleBar"></div>
    <input type="text" id="storyTextInput" class="camera-text-input hidden" autocomplete="off" />

    <div class="story-editor-bottom-bar">
      <button type="button" class="btn-compact" id="storyEditorDiscardBtn">Annulla</button>
      <button type="button" class="publish-btn" id="storyEditorPublishBtn">Condividi nella storia</button>
    </div>
  </div>

  <!-- Pulsante invisibile per soddisfare home.js -->
  <button id="addPostBtn" class="hidden"></button>

  <script type="module" src="home.js"></script>
  <script src="sidebar-toggle.js"></script>
  <script src="cookie-banner.js"></script>
</body>
</html>
