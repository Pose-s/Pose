<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Impostazioni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span data-i18n="nav_news">News</span>
        </a>
        <a href="home.html" class="nav-item">
          <i data-lucide="home"></i>
          <span data-i18n="nav_home">Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span data-i18n="nav_profile">Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> <span data-i18n="btn_logout">Esci</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="settings-page">
        <h1 data-i18n="settings_title">Impostazioni</h1>

        <!-- Aspetto & Lingua -->
        <section class="settings-section">
          <h2 data-i18n="appearance">Aspetto</h2>
          
          <div class="settings-row">
            <span data-i18n="dark_theme">Tema scuro</span>
            <label class="theme-switch">
              <input type="checkbox" id="themeToggle" />
              <span class="theme-slider"></span>
            </label>
          </div>

          <div class="form-group" style="margin-top: 14px;">
            <label for="langSelect" data-i18n="language_label">Lingua dell'app</label>
            <select id="langSelect" class="report-select" style="margin-top: 4px;">
              <option value="it">Italiano</option>
              <option value="en">English</option>
              <option value="pt">Português</option>
              <option value="es">Español</option>
            </select>
          </div>
        </section>

        <!-- Account -->
        <section class="settings-section">
          <h2 data-i18n="account_mgmt">Gestione account</h2>
          <p class="settings-current"><span data-i18n="current_email">Email attuale:</span> <strong id="currentEmailDisplay">-</strong></p>

          <form id="changeEmailForm" class="settings-form">
            <div class="form-group">
              <label for="newEmailInput" data-i18n="new_email">Nuova email</label>
              <input type="email" id="newEmailInput" required />
            </div>
            <div class="form-group">
              <label for="emailCurrentPasswordInput" data-i18n="curr_pwd_confirm">Password attuale (per conferma)</label>
              <input type="password" id="emailCurrentPasswordInput" required />
            </div>
            <p id="emailMsg" class="auth-error hidden"></p>
            <button type="submit" class="btn-compact" data-i18n="btn_change_email">Cambia email</button>
          </form>

          <form id="changePasswordForm" class="settings-form">
            <div class="form-group">
              <label for="currentPasswordInput" data-i18n="curr_pwd">Password attuale</label>
              <input type="password" id="currentPasswordInput" required />
            </div>
            <div class="form-group">
              <label for="newPasswordInput" data-i18n="new_pwd">Nuova password</label>
              <input type="password" id="newPasswordInput" required minlength="6" />
            </div>
            <p id="passwordMsg" class="auth-error hidden"></p>
            <button type="submit" class="btn-compact" data-i18n="btn_change_pwd">Cambia password</button>
          </form>

          <a href="profile.html" class="settings-link" data-i18n="edit_profile_link">Modifica bio, foto e username →</a>
        </section>

        <!-- Utenti bloccati -->
        <section class="settings-section">
          <h2 data-i18n="blocked_users">Utenti bloccati</h2>
          <div id="blockedUsersList">
            <p class="search-empty">Caricamento...</p>
          </div>
        </section>

        <!-- Storie -->
        <section class="settings-section">
          <h2 data-i18n="stories">Storie</h2>
          <div class="form-group">
            <label for="storyDurationSelect" data-i18n="story_duration">Durata di visualizzazione</label>
            <select id="storyDurationSelect" class="report-select">
              <option value="3">3 ore</option>
              <option value="12">12 ore</option>
              <option value="24">24 ore</option>
              <option value="48">48 ore</option>
            </select>
          </div>
          <p id="storyDurationMsg" class="auth-error hidden"></p>
          <button type="button" class="btn-compact" id="saveStoryDurationBtn" data-i18n="btn_save">Salva</button>
        </section>

        <!-- Salvati -->
        <section class="settings-section">
          <h2 data-i18n="saved_title">Salvati</h2>
          <p class="settings-current" data-i18n="saved_desc">Post e storie che hai salvato.</p>
          <a href="saved.html" class="settings-link" data-i18n="open_saved">Apri i salvati →</a>
        </section>

        <!-- Legali -->
        <section class="settings-section">
          <h2 data-i18n="legal_privacy">Legali e Privacy</h2>
          <div class="settings-links-list">
            <a href="privacy.html" class="settings-link">Privacy Policy</a>
            <a href="terms.html" class="settings-link">Termini di Servizio</a>
            <button type="button" class="settings-link settings-link-btn" id="cookieSettingsBtn" data-i18n="cookie_mgmt">Gestione Cookie</button>
          </div>
        </section>

        <!-- Login/Logout -->
        <section class="settings-section">
          <h2 data-i18n="session_title">Sessione</h2>
          <button type="button" class="btn-compact btn-danger" id="settingsLogoutBtn" data-i18n="logout_account">Esci dall'account</button>
        </section>

      </div>
    </main>
  </div>

  <script type="module" src="settings.js"></script>
  <script src="sidebar-toggle.js"></script>
  <script src="theme.js"></script>
</body>
</html>
