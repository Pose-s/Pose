<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Profilo utente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="lang.js"></script>
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span>News</span>
        </a>
        <a href="home.html" class="nav-item">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span>Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> Esci
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="user-top-bar">
        <div class="post-menu">
          <button type="button" class="post-menu-btn" id="userOptionsBtn">
            <i data-lucide="more-vertical"></i>
          </button>
          <div class="post-menu-dropdown hidden" id="userOptionsDropdown">
            <button type="button" class="menu-item menu-item-danger" id="blockToggleBtn">Blocca</button>
            <button type="button" class="menu-item" id="reportBtn">Segnala</button>
          </div>
        </div>
      </div>

      <div class="profile-page" id="profilePageContent">
        <div class="loader">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modale Commenti -->
  <div class="modal-overlay hidden" id="commentsModal">
  <div class="modal modal-post-detail">
    <div class="modal-header">
      <h2>Post</h2>
      <button class="modal-close" id="closeCommentsBtn">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div id="commentsPostMedia"></div>
    <p id="commentsPostCaption" class="post-caption hidden"></p>
    <div class="comments-list" id="commentsList"></div>
        <button class="modal-close" id="closeCommentsBtn">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <form id="commentForm" class="comment-form">
        <input type="text" id="commentInput" placeholder="Scrivi un commento..." required />
        <button type="submit" class="comment-send-btn">
          <i data-lucide="send"></i>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="user.js"></script>
  <script src="sidebar-toggle.js"></script>
  <script src="cookie-banner.js"></script>
  <!-- Modale Segnalazione -->
<div class="modal-overlay hidden" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Segnala utente</h2>
      <button class="modal-close" id="closeReportBtn">
        <i data-lucide="x"></i>
      </button>
    </div>
    <form id="reportForm">
      <div class="form-group">
        <label for="reportReasonSelect">Motivo della segnalazione</label>
        <select id="reportReasonSelect" required class="report-select">
          <option value="">Seleziona un motivo...</option>
          <option value="spam">Spam</option>
          <option value="molestie">Molestie o bullismo</option>
          <option value="contenuti_inappropriati">Contenuti inappropriati</option>
          <option value="falso_profilo">Profilo falso</option>
          <option value="altro">Altro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="reportDetailsInput">Dettagli (facoltativo)</label>
        <textarea id="reportDetailsInput" placeholder="Aggiungi altri dettagli..."></textarea>
      </div>
      <p id="reportMsg" class="auth-error hidden"></p>
      <button type="submit" class="publish-btn" id="reportSubmitBtn">Invia segnalazione</button>
    </form>
  </div>
</div>
<div class="modal-overlay hidden" id="shareModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Invia post</h2>
      <button class="modal-close" id="closeShareBtn"><i data-lucide="x"></i></button>
    </div>
    <input type="text" id="shareSearchInput" placeholder="Cerca..." class="search-input-modal" />
    <p class="otp-info hidden" id="shareEmptyMsg">Puoi inviare messaggi solo a chi ti segue e che segui anche tu.</p>
    <div id="shareFriendsList"></div>
  </div>
</div>
<div class="modal-overlay hidden" id="tagChoiceModal">
  <div class="modal modal-small">
    <div class="modal-header">
      <h2>Tag</h2>
      <button class="modal-close" id="closeTagChoiceBtn"><i data-lucide="x"></i></button>
    </div>
    <button type="button" class="menu-item" id="viewTagsChoiceBtn">
      <i data-lucide="eye"></i> Vedi persone taggate
    </button>
    <button type="button" class="menu-item" id="addTagsChoiceBtn">
      <i data-lucide="user-plus"></i> Aggiungi tag
    </button>
  </div>
</div>
</body>
</html>
