<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Profilo utente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <button class="menu-toggle-btn" id="menuToggleBtn">
      <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="newspaper"></i>
          <span>News</span>
        </a>
        <a href="home.html" class="nav-item">
          <i data-lucide="home"></i>
          <span>Home</span>
        </a>
        <a href="profile.html" class="nav-item">
          <i data-lucide="user"></i>
          <span>Profilo</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i data-lucide="log-out"></i> Esci
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="profile-page" id="profilePageContent">
        <div class="loader">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modale Commenti -->
  <div class="modal-overlay hidden" id="commentsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Commenti</h2>
        <button class="modal-close" id="closeCommentsBtn">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <form id="commentForm" class="comment-form">
        <input type="text" id="commentInput" placeholder="Scrivi un commento..." required />
        <button type="submit" class="comment-send-btn">
          <i data-lucide="send"></i>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="user.js"></script>
  <script src="sidebar-toggle.js"></script>
</body>
</html>
