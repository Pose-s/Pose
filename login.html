<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pose - Accedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <div class="logo" style="justify-content:center; margin-bottom: 24px;">
        <img src="logo.png" class="logo-img" alt="Pose" />
        <span>Pose</span>
      </div>

      <h2>Accedi</h2>

      <div class="form-group">
        <label>Accedi con</label>
        <div class="contact-toggle">
          <button type="button" class="toggle-btn active" data-type="email">Email</button>
          <button type="button" class="toggle-btn" data-type="phone">Telefono</button>
        </div>
      </div>

      <form id="authForm">
        <div class="form-group" id="loginEmailField">
          <label for="emailInput">Email</label>
          <input type="email" id="emailInput" />
        </div>

        <div class="form-group hidden" id="loginPhoneField">
          <label for="phoneInput">Numero di telefono</label>
          <input type="tel" id="phoneInput" placeholder="+39 333 1234567" />
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" required minlength="6" />
        </div>
        <p id="errorMsg" class="auth-error hidden"></p>
        <button type="submit" class="publish-btn" id="authBtn">Accedi</button>
      </form>

      <p class="auth-toggle">
        <span>Non hai un account?</span>
        <a href="register.html">Registrati</a>
      </p>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
